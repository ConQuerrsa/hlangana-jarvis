<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#FF6B1A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Jarvis"/>
<link rel="manifest" href="./manifest.json"/>
<title>Hlangana Jarvis</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --orange: #FF6B1A;
    --gold: #FFB347;
    --dark: #0F0F0F;
    --card: #1A1A1A;
    --card2: #222222;
    --green: #2ECC71;
    --red: #FF4444;
    --text: #F0EDE8;
    --muted: #777;
    --fb: #1877F2;
    --tt: #FF0050;
    --wa: #25D366;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--dark); color: var(--text); font-family: 'Outfit', sans-serif; height: 100%; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: -webkit-fill-available; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 3px; height: 3px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

  /* ANIMATIONS */
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-up { animation: fadeUp .35s ease both; }

  /* HEADER */
  #header {
    background: #0C0C0C;
    border-bottom: 1px solid #1f1f1f;
    padding: 0 16px;
    padding-top: env(safe-area-inset-top);
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: calc(56px + env(safe-area-inset-top));
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--orange), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .logo-text { line-height: 1; }
  .logo-title { font-family: 'Bebas Neue', cursive; font-size: 19px; letter-spacing: 2px; color: var(--text); }
  .logo-sub { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; margin-top: 1px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2.5s ease-in-out infinite;
  }
  #clock { font-size: 12px; color: var(--muted); margin-left: 6px; }

  /* NAV BAR (bottom) */
  #nav {
    background: #0C0C0C;
    border-top: 1px solid #1f1f1f;
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
    z-index: 100;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 4px; border: none; background: transparent; cursor: pointer;
    color: var(--muted); font-family: 'Outfit', sans-serif; font-size: 9px; font-weight: 600;
    letter-spacing: .5px; gap: 4px; transition: color .2s;
  }
  .nav-btn.active { color: var(--orange); }
  .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
  .nav-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--orange); margin-top: 2px; }

  /* CONTENT */
  #content { flex: 1; overflow-y: auto; padding: 16px; }

  /* CARDS */
  .card {
    background: var(--card); border: 1px solid #252525;
    border-radius: 14px; padding: 18px; margin-bottom: 14px;
  }
  .card-title { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; }

  /* STAT ROW */
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-card {
    background: var(--card); border: 1px solid #252525; border-radius: 12px; padding: 14px;
  }
  .stat-val { font-family: 'Bebas Neue', cursive; font-size: 32px; letter-spacing: 1px; line-height: 1; }
  .stat-label { font-size: 12px; color: var(--text); font-weight: 600; margin-top: 2px; }
  .stat-sub { font-size: 10px; color: var(--muted); margin-top: 3px; }

  /* TIP BANNER */
  .tip-banner {
    background: linear-gradient(135deg, rgba(255,107,26,.1), rgba(255,179,71,.05));
    border: 1px solid rgba(255,107,26,.2);
    border-radius: 12px; padding: 14px 16px;
    display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px;
  }
  .tip-label { font-size: 9px; color: var(--orange); font-weight: 700; letter-spacing: 1.5px; margin-bottom: 4px; }
  .tip-text { font-size: 13px; color: var(--text); line-height: 1.5; }

  /* BADGE */
  .badge {
    display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 10px; font-weight: 700;
  }
  .badge-fb { background: rgba(24,119,242,.15); color: var(--fb); border: 1px solid rgba(24,119,242,.2); }
  .badge-tt { background: rgba(255,0,80,.15); color: var(--tt); border: 1px solid rgba(255,0,80,.2); }
  .badge-wa { background: rgba(37,211,102,.15); color: var(--wa); border: 1px solid rgba(37,211,102,.2); }
  .badge-all { background: rgba(255,179,71,.15); color: var(--gold); border: 1px solid rgba(255,179,71,.2); }
  .badge-posted { background: rgba(46,204,113,.15); color: var(--green); border: 1px solid rgba(46,204,113,.2); }
  .badge-draft { background: rgba(119,119,119,.15); color: var(--muted); border: 1px solid rgba(119,119,119,.2); }

  /* PLATFORM CARDS */
  .platform-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .platform-card {
    background: var(--card2); border-radius: 10px; padding: 12px 10px;
    border-left: 3px solid;
  }
  .platform-name { font-size: 11px; font-weight: 700; margin-top: 4px; }
  .platform-role { font-size: 11px; color: var(--text); font-weight: 600; margin-top: 3px; }
  .platform-tip { font-size: 10px; color: var(--muted); margin-top: 3px; line-height: 1.3; }

  /* RECENT POST ITEM */
  .post-item {
    background: var(--card2); border-radius: 10px; padding: 12px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .post-caption { font-size: 13px; color: var(--text); line-height: 1.4; margin-bottom: 6px; }
  .post-meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .post-reactions { font-size: 11px; color: var(--gold); font-weight: 700; margin-left: auto; white-space: nowrap; }

  /* FORMS */
  .form-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
  .form-group { margin-bottom: 12px; }
  input, select, textarea {
    width: 100%; background: #2a2a2a; color: var(--text); border: 1px solid #333;
    border-radius: 9px; padding: 10px 13px; font-family: 'Outfit', sans-serif; font-size: 13px;
    outline: none; transition: border-color .2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--orange); }
  textarea { resize: vertical; min-height: 75px; }
  select { cursor: pointer; }

  /* BUTTONS */
  .btn {
    border: none; border-radius: 10px; padding: 12px 20px;
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer; transition: all .2s; width: 100%;
  }
  .btn-primary { background: linear-gradient(135deg, var(--orange), var(--gold)); color: #fff; }
  .btn-primary:active { transform: scale(.97); }
  .btn-primary:disabled { background: #333; color: var(--muted); cursor: not-allowed; }
  .btn-secondary { background: var(--card2); color: var(--text); border: 1px solid #333; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-sm {
    border: none; background: transparent; cursor: pointer; font-size: 16px;
    padding: 5px; border-radius: 7px; transition: background .15s;
  }
  .btn-sm:active { background: #333; }

  /* RESULT BOX */
  .result-box {
    background: var(--card2); border-radius: 10px; padding: 14px; margin-bottom: 10px;
  }
  .result-label { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
  .result-val { font-size: 14px; color: var(--text); line-height: 1.6; }
  .result-val.hook { color: var(--gold); font-weight: 600; font-size: 15px; }

  /* HASHTAG PILLS */
  .hashtag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .hashtag { background: rgba(255,107,26,.12); color: var(--orange); border: 1px solid rgba(255,107,26,.2); border-radius: 7px; padding: 3px 10px; font-size: 12px; font-weight: 600; }

  /* TIP BOX */
  .tip-box { background: rgba(46,204,113,.08); border: 1px solid rgba(46,204,113,.15); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .tip-box-label { font-size: 9px; color: var(--green); font-weight: 700; letter-spacing: 1.5px; margin-bottom: 4px; }
  .tip-box-text { font-size: 13px; color: var(--text); }

  /* REMINDER ITEM */
  .reminder-item {
    background: var(--card2); border-radius: 10px; padding: 13px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: center;
  }
  .reminder-time { font-size: 12px; color: var(--orange); font-weight: 700; min-width: 44px; }

  /* SCHEDULE ROW */
  .schedule-row { display: flex; gap: 10px; align-items: center; margin-bottom: 9px; }
  .schedule-time { font-size: 12px; color: var(--orange); font-weight: 700; min-width: 44px; }
  .schedule-text { font-size: 13px; color: var(--text); }

  /* PHASE BADGE */
  .phase-card {
    background: rgba(255,107,26,.07); border: 1px solid rgba(255,107,26,.15);
    border-radius: 10px; padding: 12px 14px;
  }
  .phase-label { font-size: 9px; color: var(--orange); font-weight: 700; letter-spacing: 1.5px; margin-bottom: 3px; }
  .phase-val { font-size: 14px; color: var(--text); font-weight: 600; }
  .phase-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* LOADING SPINNER */
  .spinner { width: 20px; height: 20px; border: 2px solid #333; border-top-color: var(--orange); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }

  /* DIVIDER */
  .divider { height: 1px; background: #222; margin: 14px 0; }

  /* COPY SUCCESS */
  .copy-success { background: rgba(46,204,113,.15); border: 1px solid rgba(46,204,113,.3); border-radius: 10px; padding: 11px 14px; font-size: 13px; color: var(--green); font-weight: 600; text-align: center; margin-top: 8px; }
  .error-box { background: rgba(255,68,68,.12); border: 1px solid rgba(255,68,68,.25); border-radius: 10px; padding: 11px 14px; font-size: 13px; color: #ff8080; margin-top: 10px; }

  /* ADD FORM */
  .add-form { background: var(--card); border: 1px solid rgba(255,107,26,.2); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  /* EMPTY STATE */
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; }

  /* INSTALL BANNER */
  #install-banner {
    background: linear-gradient(135deg, rgba(255,107,26,.15), rgba(255,179,71,.08));
    border: 1px solid rgba(255,107,26,.25);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  #install-banner button { background: var(--orange); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-family: 'Outfit',sans-serif; font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon">🤝</div>
    <div class="logo-text">
      <div class="logo-title">HLANGANA JARVIS</div>
      <div class="logo-sub">MZANSI AI SOCIAL MANAGER</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <div class="status-dot"></div>
    <span id="clock"></span>
  </div>
</div>

<!-- CONTENT -->
<div id="content"></div>

<!-- BOTTOM NAV -->
<nav id="nav">
  <button class="nav-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">
    <span class="nav-icon">🏠</span>HOME
  </button>
  <button class="nav-btn" data-tab="caption" onclick="switchTab('caption')">
    <span class="nav-icon">⚡</span>CAPTION AI
  </button>
  <button class="nav-btn" data-tab="tracker" onclick="switchTab('tracker')">
    <span class="nav-icon">📋</span>TRACKER
  </button>
  <button class="nav-btn" data-tab="reminders" onclick="switchTab('reminders')">
    <span class="nav-icon">🔔</span>REMINDERS
  </button>
</nav>

<script>
// ── STATE ──
let currentTab = 'dashboard';
let deferredPrompt = null;
let tipIdx = 0;

const TIPS = [
  "💡 Community + trust + dignity + local reality = best emotional formula",
  "🇿🇦 Tie messaging to current SA emotional climate without going political",
  "📱 TikTok: 3–5 hashtags max. Short captions win.",
  "🤝 Stay active 30–60 min after posting to boost algorithm signals",
  "👀 Silent observers matter — build trust before selling",
  "❤️ Comment under your own posts to make them feel alive",
  "🎵 Trending sounds on TikTok dramatically improve reach",
  "🏘️ Facebook group strategy: engage first, share second"
];

const DEFAULT_POSTS = [
  { id: 1, platform: "Facebook", caption: "Community is where trust lives 🇿🇦❤️", status: "Posted", date: "2026-05-20", reactions: 8 },
  { id: 2, platform: "TikTok", caption: "Behind every clean home is a hardworking South African 🙏", status: "Posted", date: "2026-05-22", reactions: 14 },
  { id: 3, platform: "TikTok", caption: "What service is hardest to find in your area? 🤔", status: "Draft", date: "2026-05-27", reactions: 0 },
];
const DEFAULT_REMINDERS = [
  { id: 1, text: "Post TikTok video (community content)", time: "18:00", active: true },
  { id: 2, text: "Engage in Facebook groups (30 min)", time: "20:00", active: true },
];

function loadData(key, def) {
  try { const d = localStorage.getItem(key); return d ? JSON.parse(d) : JSON.parse(JSON.stringify(def)); } catch { return JSON.parse(JSON.stringify(def)); }
}
function saveData(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

let posts = loadData('jarvis_posts', DEFAULT_POSTS);
let reminders = loadData('jarvis_reminders', DEFAULT_REMINDERS);

// ── CLOCK ──
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 1000); updateClock();

// ── TIPS ROTATION ──
setInterval(() => {
  tipIdx = (tipIdx + 1) % TIPS.length;
  const el = document.getElementById('tip-text');
  if (el) { el.style.opacity = 0; setTimeout(() => { el.textContent = TIPS[tipIdx]; el.style.opacity = 1; }, 250); }
}, 6000);

// ── INSTALL PROMPT ──
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  const banner = document.getElementById('install-banner');
  if (banner) banner.style.display = 'flex';
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById('install-banner').style.display = 'none'; });
}

// ── BADGE HELPER ──
function badge(platform) {
  const map = { Facebook: 'badge-fb', TikTok: 'badge-tt', WhatsApp: 'badge-wa', 'All Platforms': 'badge-all', Posted: 'badge-posted', Draft: 'badge-draft' };
  return `<span class="badge ${map[platform] || 'badge-draft'}">${platform}</span>`;
}

// ── TAB SWITCH ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
}

// ── RENDER ──
function render() {
  const el = document.getElementById('content');
  el.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'fade-up';
  if (currentTab === 'dashboard') wrap.innerHTML = dashboardHTML();
  else if (currentTab === 'caption') wrap.innerHTML = captionHTML();
  else if (currentTab === 'tracker') wrap.innerHTML = trackerHTML();
  else if (currentTab === 'reminders') wrap.innerHTML = remindersHTML();
  el.appendChild(wrap);
}

// ══════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════
function dashboardHTML() {
  const posted = posts.filter(p => p.status === 'Posted').length;
  const drafts = posts.filter(p => p.status === 'Draft').length;
  const reactions = posts.reduce((a, p) => a + (p.reactions || 0), 0);
  const tiktok = posts.filter(p => p.platform === 'TikTok' && p.status === 'Posted').length;
  const recent = [...posts].sort((a,b) => new Date(b.date)-new Date(a.date)).slice(0,3);
  const activeRem = reminders.filter(r => r.active).slice(0,3);
  const installDisplay = deferredPrompt ? 'flex' : 'none';

  return `
    <div id="install-banner" style="display:${installDisplay}">
      <div style="flex:1">
        <div style="font-size:11px;color:var(--orange);font-weight:700;margin-bottom:3px">ADD TO HOME SCREEN</div>
        <div style="font-size:12px;color:var(--text)">Install Jarvis as an app for quick access 🤝</div>
      </div>
      <button onclick="installApp()">Install</button>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-val" style="color:var(--orange)">${posted}</div><div class="stat-label">Published</div><div class="stat-sub">Across platforms</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--gold)">${reactions}</div><div class="stat-label">Reactions</div><div class="stat-sub">Total engagement</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#64B5F6">${drafts}</div><div class="stat-label">Drafts</div><div class="stat-sub">Ready to post</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--tt)">${tiktok}</div><div class="stat-label">TikTok</div><div class="stat-sub">Discovery posts</div></div>
    </div>

    <div class="tip-banner">
      <span style="font-size:22px">🧠</span>
      <div style="flex:1">
        <div class="tip-label">JARVIS STRATEGY TIP</div>
        <div class="tip-text" id="tip-text" style="transition:opacity .25s">${TIPS[tipIdx]}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Recent Content</div>
      ${recent.map(p => `
        <div class="post-item">
          <div style="flex:1">
            <div class="post-caption">${p.caption}</div>
            <div class="post-meta">${badge(p.platform)} ${badge(p.status)} <span style="font-size:10px;color:var(--muted)">${p.date}</span>${p.reactions > 0 ? `<span class="post-reactions">❤️ ${p.reactions}</span>` : ''}</div>
          </div>
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-title">Today's Tasks</div>
      ${activeRem.length === 0 ? '<div class="empty">No active reminders</div>' : activeRem.map(r => `
        <div class="reminder-item">
          <span style="font-size:18px">🔔</span>
          <div style="flex:1"><div style="font-size:13px;color:var(--text)">${r.text}</div><div class="reminder-time">${r.time}</div></div>
        </div>`).join('')}
      <div class="divider"></div>
      <div class="phase-card">
        <div class="phase-label">CURRENT PHASE</div>
        <div class="phase-val">Phase 1 — Brand Presence</div>
        <div class="phase-sub">Build familiarity & trust 🇿🇦</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Platform Strategy</div>
      <div class="platform-row">
        <div class="platform-card" style="border-color:var(--tt)">
          <div style="font-size:20px">🎵</div>
          <div class="platform-name" style="color:var(--tt)">TikTok</div>
          <div class="platform-role">Reach</div>
          <div class="platform-tip">Trending sounds + short captions</div>
        </div>
        <div class="platform-card" style="border-color:var(--fb)">
          <div style="font-size:20px">👥</div>
          <div class="platform-name" style="color:var(--fb)">Facebook</div>
          <div class="platform-role">Trust</div>
          <div class="platform-tip">Groups + warm replies</div>
        </div>
        <div class="platform-card" style="border-color:var(--wa)">
          <div style="font-size:20px">💬</div>
          <div class="platform-name" style="color:var(--wa)">WhatsApp</div>
          <div class="platform-role">Relationship</div>
          <div class="platform-tip">Short, warm updates</div>
        </div>
      </div>
    </div>
  `;
}

// ══════════════════════════════════════
// CAPTION AI
// ══════════════════════════════════════
const STYLES = ["Ubuntu/Community","Trust & Reliability","Provider Appreciation","Household Pain Point","SA Reality","Engagement Question"];
const PLATFORMS = ["TikTok","Facebook","WhatsApp","All Platforms"];
let captionState = { style: STYLES[0], platform: PLATFORMS[0], topic: '', loading: false, result: null, error: null, copied: false };

function captionHTML() {
  const s = captionState;
  return `
    <div class="card">
      <div class="card-title">⚡ AI Caption Generator</div>
      <div class="form-group">
        <div class="form-label">Content Style</div>
        <select onchange="captionState.style=this.value">
          ${STYLES.map(st => `<option ${s.style===st?'selected':''}>${st}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <div class="form-label">Platform</div>
        <select onchange="captionState.platform=this.value">
          ${PLATFORMS.map(p => `<option ${s.platform===p?'selected':''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <div class="form-label">Topic / Theme</div>
        <textarea id="caption-topic" placeholder="e.g. trustworthy cleaners, community support, hardworking providers..." onchange="captionState.topic=this.value" oninput="captionState.topic=this.value">${s.topic}</textarea>
      </div>
      <button class="btn btn-primary" onclick="generateCaption()" ${s.loading?'disabled':''}>
        ${s.loading ? '<span class="spinner"></span>Jarvis is thinking...' : '⚡ Generate Caption'}
      </button>
      ${s.error ? `<div class="error-box">${s.error}</div>` : ''}
    </div>

    ${s.result ? `
    <div class="card fade-up" style="border-color:rgba(255,107,26,.2)">
      <div class="card-title" style="color:var(--orange)">✅ Generated Caption</div>
      <div class="result-box"><div class="result-label">Hook</div><div class="result-val hook">${s.result.hook}</div></div>
      <div class="result-box"><div class="result-label">Caption</div><div class="result-val">${s.result.caption}</div></div>
      <div class="result-box">
        <div class="result-label">Hashtags</div>
        <div class="hashtag-row">${(s.result.hashtags||[]).map(h=>`<span class="hashtag">#${h}</span>`).join('')}</div>
      </div>
      <div class="tip-box"><div class="tip-box-label">💡 JARVIS TIP</div><div class="tip-box-text">${s.result.tip}</div></div>
      <button class="btn btn-secondary" onclick="copyCaption()" style="margin-bottom:4px">
        ${s.copied ? '✅ Copied to Clipboard!' : '📋 Copy Caption + Hashtags'}
      </button>
    </div>` : ''}
  `;
}

async function generateCaption() {
  captionState.topic = document.getElementById('caption-topic')?.value || captionState.topic;
  if (!captionState.topic.trim()) { captionState.error = 'Add a topic or theme first.'; render(); return; }
  captionState.loading = true; captionState.error = null; captionState.result = null; captionState.copied = false;
  render();

  const sys = `You are Jarvis, the AI content assistant for Hlangana Mzansi — a South African community service marketplace.
Generate social media captions that feel: warm, human, Ubuntu-driven, community-centered, relatable to South Africans, trustworthy — never robotic, never scammy, never corporate.
For TikTok: SHORT captions (1-2 lines max), 3-5 hashtags only.
For Facebook: 2-3 sentences, conversational.
For WhatsApp: Very short, warm, one-liners.
Respond ONLY with valid JSON, no markdown, no backticks:
{"caption":"...","hashtags":["tag1","tag2"],"hook":"...","tip":"..."}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 1000,
        system: sys,
        messages: [{ role: 'user', content: `Generate a ${captionState.style} style caption for ${captionState.platform}. Topic: "${captionState.topic}". Make it authentic, South African, community-driven.` }]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).map(i=>i.text||'').join('').replace(/```json|```/g,'').trim();
    captionState.result = JSON.parse(text);
  } catch(e) { captionState.error = 'Generation failed. Check your connection and try again.'; }
  captionState.loading = false; render();
  document.getElementById('content').scrollTo({ top: 0, behavior: 'smooth' });
}

function copyCaption() {
  if (!captionState.result) return;
  const text = `${captionState.result.caption}\n\n${(captionState.result.hashtags||[]).map(h=>'#'+h).join(' ')}`;
  navigator.clipboard.writeText(text).then(() => { captionState.copied = true; render(); setTimeout(() => { captionState.copied = false; render(); }, 2500); });
}

// ══════════════════════════════════════
// TRACKER
// ══════════════════════════════════════
let trackerAdding = false;
let trackerForm = { platform: 'TikTok', caption: '', status: 'Draft', date: new Date().toISOString().split('T')[0], reactions: '' };

function trackerHTML() {
  const sorted = [...posts].sort((a,b) => new Date(b.date)-new Date(a.date));
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:700;text-transform:uppercase">📋 Content Inventory — ${posts.length} entries</div>
      <button class="btn btn-sm" style="background:${trackerAdding?'#333':'var(--orange)'};color:#fff;padding:8px 14px;font-size:12px;font-weight:700;border-radius:9px;border:none;cursor:pointer;font-family:'Outfit',sans-serif" onclick="toggleTrackerForm()">${trackerAdding?'Cancel':'+ Add'}</button>
    </div>

    ${trackerAdding ? `
    <div class="add-form">
      <div class="row-2" style="margin-bottom:10px">
        <div>
          <div class="form-label">Platform</div>
          <select onchange="trackerForm.platform=this.value">
            ${['TikTok','Facebook','WhatsApp'].map(p=>`<option ${trackerForm.platform===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </div>
        <div>
          <div class="form-label">Status</div>
          <select onchange="trackerForm.status=this.value">
            <option ${trackerForm.status==='Draft'?'selected':''}>Draft</option>
            <option ${trackerForm.status==='Posted'?'selected':''}>Posted</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">Date</div>
        <input type="date" value="${trackerForm.date}" onchange="trackerForm.date=this.value"/>
      </div>
      <div class="form-group">
        <div class="form-label">Caption</div>
        <textarea id="tracker-caption" placeholder="Caption text..." oninput="trackerForm.caption=this.value">${trackerForm.caption}</textarea>
      </div>
      <div class="form-group">
        <div class="form-label">Reactions (optional)</div>
        <input type="number" value="${trackerForm.reactions}" placeholder="0" min="0" oninput="trackerForm.reactions=this.value"/>
      </div>
      <button class="btn btn-green" onclick="addPost()">Save Post</button>
    </div>` : ''}

    ${sorted.length === 0 ? '<div class="empty">No posts yet. Add your first post above.</div>' : sorted.map(p => `
      <div class="post-item">
        <div style="flex:1">
          <div class="post-caption">${p.caption}</div>
          <div class="post-meta">${badge(p.platform)} ${badge(p.status)} <span style="font-size:10px;color:var(--muted)">${p.date}</span>${p.reactions > 0 ? `<span class="post-reactions">❤️ ${p.reactions}</span>` : ''}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="btn-sm" onclick="togglePostStatus(${p.id})" title="Toggle status">🔄</button>
          <button class="btn-sm" style="color:var(--red)" onclick="deletePost(${p.id})" title="Delete">🗑</button>
        </div>
      </div>`).join('')}
  `;
}

function toggleTrackerForm() { trackerAdding = !trackerAdding; render(); }
function addPost() {
  trackerForm.caption = document.getElementById('tracker-caption')?.value || trackerForm.caption;
  if (!trackerForm.caption.trim()) return;
  posts.push({ ...trackerForm, id: Date.now(), reactions: parseInt(trackerForm.reactions) || 0 });
  saveData('jarvis_posts', posts);
  trackerForm = { platform: 'TikTok', caption: '', status: 'Draft', date: new Date().toISOString().split('T')[0], reactions: '' };
  trackerAdding = false; render();
}
function deletePost(id) { if (confirm('Delete this post?')) { posts = posts.filter(p => p.id !== id); saveData('jarvis_posts', posts); render(); } }
function togglePostStatus(id) { posts = posts.map(p => p.id === id ? { ...p, status: p.status === 'Posted' ? 'Draft' : 'Posted' } : p); saveData('jarvis_posts', posts); render(); }

// ══════════════════════════════════════
// REMINDERS
// ══════════════════════════════════════
let remAdding = false;
let remForm = { text: '', time: '18:00' };

function remindersHTML() {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:700;text-transform:uppercase">🔔 Reminders — ${reminders.filter(r=>r.active).length} active</div>
      <button style="background:${remAdding?'#333':'var(--orange)'};color:#fff;border:none;border-radius:9px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif" onclick="toggleRemForm()">${remAdding?'Cancel':'+ Add'}</button>
    </div>

    ${remAdding ? `
    <div class="add-form">
      <div class="form-group">
        <div class="form-label">Reminder</div>
        <input id="rem-text" type="text" placeholder="e.g. Post TikTok video" value="${remForm.text}" oninput="remForm.text=this.value"/>
      </div>
      <div class="form-group">
        <div class="form-label">Time</div>
        <input type="time" value="${remForm.time}" onchange="remForm.time=this.value"/>
      </div>
      <button class="btn btn-green" onclick="addReminder()">Save Reminder</button>
    </div>` : ''}

    ${reminders.map(r => `
      <div class="reminder-item" style="opacity:${r.active?1:.45}">
        <span style="font-size:20px">🔔</span>
        <div style="flex:1">
          <div style="font-size:13px;color:var(--text)">${r.text}</div>
          <div class="reminder-time">${r.time}</div>
        </div>
        <button class="btn-sm" onclick="toggleReminder(${r.id})">${r.active?'✅':'⭕'}</button>
        <button class="btn-sm" style="color:var(--red)" onclick="deleteReminder(${r.id})">🗑</button>
      </div>`).join('')}

    <div class="divider"></div>
    <div class="card">
      <div class="card-title" style="color:var(--orange)">⚡ Jarvis Recommended Schedule</div>
      ${[
        ['07:00','Check SA trending topics & news'],
        ['12:00','Post 1 piece of content (lunch hour reach)'],
        ['17:30','TikTok post — peak commute time 🎵'],
        ['19:00','Engage in Facebook groups (30 min)'],
        ['20:00','Reply to all messages & comments'],
        ['21:00','Review day\'s performance'],
      ].map(([t,a]) => `
        <div class="schedule-row">
          <div class="schedule-time">${t}</div>
          <div class="schedule-text">${a}</div>
        </div>`).join('')}
    </div>
  `;
}

function toggleRemForm() { remAdding = !remAdding; render(); }
function addReminder() {
  remForm.text = document.getElementById('rem-text')?.value || remForm.text;
  if (!remForm.text.trim()) return;
  reminders.push({ ...remForm, id: Date.now(), active: true });
  saveData('jarvis_reminders', reminders);
  remForm = { text: '', time: '18:00' }; remAdding = false; render();
}
function toggleReminder(id) { reminders = reminders.map(r => r.id === id ? { ...r, active: !r.active } : r); saveData('jarvis_reminders', reminders); render(); }
function deleteReminder(id) { reminders = reminders.filter(r => r.id !== id); saveData('jarvis_reminders', reminders); render(); }

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ── INIT ──
render();
</script>
